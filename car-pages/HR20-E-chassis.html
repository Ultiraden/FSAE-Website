<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR20-E Chassis | Highlander Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="icon" href="assets/HRlogo.png" type="image/png">
</head>
<body>
    <div id="site-navbar"></div>
    <main>
        <section style="padding: 6rem 2rem 2rem; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div style="text-align: center;">
                <h1>HR20-E Chassis</h1>
                <p>Content coming soon...</p>
            </div>
        </section>
    </main>
    <footer>
        <p>FSAE UCR | Highlander Racing</p>
    </footer>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script>
        const initIslandHeader = () => {
            const header = document.querySelector("#site-navbar header");
            if (!header) return;
            const toggleIsland = () => {
                header.classList.toggle("is-island", window.scrollY > 10);
            };
            window.addEventListener("scroll", toggleIsland);
            toggleIsland();
        };
        fetch("partials/navbar.html")
            .then((res) => res.text())
            .then((html) => {
                document.getElementById("site-navbar").innerHTML = html;
                initIslandHeader();
            })
            .catch(() => {});
    </script>
</body>
</html>
